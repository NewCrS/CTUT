<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
  <title>Sơ đồ trường</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: sans-serif;
      text-align: center;
      background-color: #f4f7f6;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    /* Nút quay lại hoàn toàn trong suốt */
    .back-btn {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      background: transparent;
      border: none;
      color: #1a1a1a;
      text-decoration: none;
      transition: transform 0.1s ease, opacity 0.2s ease;
    }

    .back-btn:active {
      transform: scale(0.85);
      opacity: 0.6;
    }

    .back-btn svg {
      width: 32px;
      height: 32px;
      fill: none;
      stroke: currentColor;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0px 2px 4px rgba(0, 0, 0, 0.25));
    }

    .map-container {
      position: relative;
      width: 100%;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      touch-action: none; /* Tránh xung đột cuộn trang mặc định của trình duyệt */
    }

    .map-container img {
      width: 100%;
      max-width: 900px;
      height: auto;
      display: block;
      transform-origin: center center;
      transition: transform 0.05s ease-out;
      will-change: transform;
    }
  </style>
</head>
<body>

  <!-- Nút quay lại chỉ chứa mũi tên < trong suốt -->
  <a href="../" class="back-btn" aria-label="Quay lại">
    <svg viewBox="0 0 24 24">
      <polyline points="15 18 9 12 15 6"></polyline>
    </svg>
  </a>
  
  <div class="map-container" id="mapContainer">
    <img src="../assets/map/map.png" alt="Sơ đồ trường" id="mapImg">
  </div>

  <script>
    const container = document.getElementById('mapContainer');
    const img = document.getElementById('mapImg');

    let scale = 1;
    let pointX = 0;
    let pointY = 0;
    let startX = 0;
    let startY = 0;
    let initialDistance = 0;
    let initialScale = 1;
    let lastTap = 0;

    function updateTransform() {
      img.style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`;
    }

    // Xử lý sự kiện bắt đầu chạm
    container.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        // Kéo di chuyển ảnh (Pan)
        startX = e.touches[0].clientX - pointX;
        startY = e.touches[0].clientY - pointY;
      } else if (e.touches.length === 2) {
        // Phóng to/thu nhỏ bằng 2 ngón tay (Pinch)
        initialDistance = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        initialScale = scale;
      }
    });

    // Xử lý sự kiện di chuyển ngón tay
    container.addEventListener('touchmove', (e) => {
      e.preventDefault();

      if (e.touches.length === 1 && scale > 1) {
        // Di chuyển ảnh khi đang zoom
        pointX = e.touches[0].clientX - startX;
        pointY = e.touches[0].clientY - startY;
        updateTransform();
      } else if (e.touches.length === 2) {
        // Phóng to / Thu nhỏ
        const currentDistance = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        
        scale = Math.min(Math.max(1, initialScale * (currentDistance / initialDistance)), 4);
        
        if (scale === 1) {
          pointX = 0;
          pointY = 0;
        }
        updateTransform();
      }
    }, { passive: false });

    // Xử lý Double Tap (Chạm 2 lần liên tiếp để zoom nhanh)
    container.addEventListener('touchend', (e) => {
      const currentTime = new Date().getTime();
      const tapLength = currentTime - lastTap;
      
      if (tapLength < 300 && tapLength > 0 && e.touches.length === 0) {
        if (scale > 1) {
          scale = 1;
          pointX = 0;
          pointY = 0;
        } else {
          scale = 2.5;
        }
        updateTransform();
      }
      lastTap = currentTime;
    });
  </script>

</body>
</html>
