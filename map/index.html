<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
  <title>Sơ đồ trường</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: sans-serif;
      text-align: center;
      background-color: #f4f7f6;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    /* Nút quay lại hoàn toàn trong suốt */
    .back-btn {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      background: transparent;
      border: none;
      color: #1a1a1a;
      text-decoration: none;
      transition: transform 0.1s ease, opacity 0.2s ease;
      cursor: pointer;
    }

    .back-btn:active {
      transform: scale(0.85);
      opacity: 0.6;
    }

    .back-btn svg {
      width: 32px;
      height: 32px;
      fill: none;
      stroke: currentColor;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0px 2px 4px rgba(0, 0, 0, 0.25));
    }

    .map-container {
      position: relative;
      width: 100%;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      touch-action: none; /* Vô hiệu hóa cuộn mặc định của trình duyệt di động */
      cursor: default;
    }

    .map-container img {
      width: 100%;
      max-width: 900px;
      height: auto;
      display: block;
      transform-origin: center center;
      transition: transform 0.05s ease-out;
      will-change: transform;
      
      /* Chặn tuyệt đối hành vi chọn và kéo ảnh mặc định của trình duyệt */
      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;
      pointer-events: auto;
    }
  </style>
</head>
<body>

  <!-- Nút quay lại chỉ chứa mũi tên < trong suốt -->
  <a href="../" class="back-btn" aria-label="Quay lại">
    <svg viewBox="0 0 24 24">
      <polyline points="15 18 9 12 15 6"></polyline>
    </svg>
  </a>
  
  <div class="map-container" id="mapContainer">
    <img src="../assets/map/map.png" alt="Sơ đồ trường" id="mapImg" draggable="false">
  </div>

  <script>
    const container = document.getElementById('mapContainer');
    const img = document.getElementById('mapImg');

    let scale = 1;
    let pointX = 0;
    let pointY = 0;
    
    // Biến quản lý trạng thái chuột (Desktop)
    let isMouseDown = false;
    let startX = 0;
    let startY = 0;

    // Biến quản lý cảm ứng (Mobile)
    let initialDistance = 0;
    let initialScale = 1;
    let lastTap = 0;
    let isMultiTouch = false;
    let touchMoved = false;

    function updateTransform() {
      img.style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`;
    }

    // ==========================================
    // 1. XỬ LÝ SỰ KIỆN CHUỘT (DESKTOP)
    // ==========================================

    // Lăn chuột để Zoom In / Zoom Out
    container.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 0.25 : -0.25;
      const newScale = Math.min(Math.max(1, scale + zoomFactor), 4);

      if (newScale !== scale) {
        scale = newScale;
        if (scale === 1) {
          pointX = 0;
          pointY = 0;
        }
        container.style.cursor = scale > 1 ? 'grab' : 'default';
        updateTransform();
      }
    }, { passive: false });

    // Nhấn giữ chuột để bắt đầu kéo
    container.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return; // Chỉ nhận chuột trái
      if (scale > 1) {
        isMouseDown = true;
        startX = e.clientX - pointX;
        startY = e.clientY - pointY;
        container.style.cursor = 'grabbing';
      }
    });

    // Di chuyển chuột khi đang nhấn giữ
    window.addEventListener('mousemove', (e) => {
      if (!isMouseDown) return;
      e.preventDefault();
      pointX = e.clientX - startX;
      pointY = e.clientY - startY;
      updateTransform();
    });

    // Thả chuột
    window.addEventListener('mouseup', () => {
      if (isMouseDown) {
        isMouseDown = false;
        container.style.cursor = scale > 1 ? 'grab' : 'default';
      }
    });

    // ==========================================
    // 2. XỬ LÝ SỰ KIỆN CẢM ỨNG (MOBILE)
    // ==========================================

    container.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        // 1 ngón tay: Kéo di chuyển
        startX = e.touches[0].clientX - pointX;
        startY = e.touches[0].clientY - pointY;
        touchMoved = false;
      } else if (e.touches.length >= 2) {
        // Đánh dấu đang thực hiện thao tác đa điểm (pinch zoom)
        isMultiTouch = true;
        e.preventDefault();
        initialDistance = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        initialScale = scale;
      }
    }, { passive: false });

    container.addEventListener('touchmove', (e) => {
      touchMoved = true;
      if (e.touches.length === 1 && scale > 1 && !isMultiTouch) {
        // Kéo di chuyển bản đồ khi đang zoom (chỉ nhận khi không phải vừa pinch xong)
        e.preventDefault();
        pointX = e.touches[0].clientX - startX;
        pointY = e.touches[0].clientY - startY;
        updateTransform();
      } else if (e.touches.length === 2) {
        // Tính toán zoom 2 ngón
        e.preventDefault();
        const currentDistance = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        
        if (initialDistance > 0) {
          scale = Math.min(Math.max(1, initialScale * (currentDistance / initialDistance)), 4);
          if (scale === 1) {
            pointX = 0;
            pointY = 0;
          }
          updateTransform();
        }
      }
    }, { passive: false });

    // Xử lý khi ngón tay nhấc khỏi màn hình
    container.addEventListener('touchend', (e) => {
      // Khi tất cả các ngón tay đã rời khỏi màn hình
      if (e.touches.length === 0) {
        if (isMultiTouch) {
          // Bỏ qua logic double-tap nếu vừa thực hiện thao tác pinch 2 ngón
          isMultiTouch = false;
          lastTap = 0;
          return;
        }

        // Chỉ tính Double Tap khi chạm 1 ngón và không thực hiện kéo rê màn hình
        const currentTime = new Date().getTime();
        const tapLength = currentTime - lastTap;
        
        if (tapLength < 300 && tapLength > 0 && !touchMoved) {
          if (scale > 1) {
            scale = 1;
            pointX = 0;
            pointY = 0;
          } else {
            scale = 2.5;
          }
          updateTransform();
        }
        lastTap = currentTime;
      }
    });

    // Vô hiệu hóa sự kiện kéo ảnh mặc định của trình duyệt
    img.addEventListener('dragstart', (e) => e.preventDefault());
  </script>

</body>
</html>
